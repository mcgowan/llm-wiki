  :root {
    --bg: #0e1117; --panel: #161b25; --line: #2a3140; --text: #dbe2ee;
    --dim: #8b95a7; --accent: #4f8ef7;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.55 "Saira", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: absolute; top: 14px; left: 16px; display: flex; flex-direction: column;
    gap: 10px; pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  #hud h1 { font-size: 19px; font-weight: 600; letter-spacing: .02em; }
  #hud-top { display: flex; align-items: center; gap: 14px; }
  #search {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 13px; width: 210px;
  }
  #search::placeholder { color: var(--dim); }
  #search:focus { outline: none; border-color: var(--accent); }
  #search-wrap { position: relative; }
  #search { padding-right: 30px; }
  #search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; border: none; border-radius: 50%;
    background: none; color: var(--dim); cursor: pointer;
    font: 13px "Saira", sans-serif; line-height: 1; display: none; padding: 0;
  }
  #search-clear:hover { color: var(--text); background: var(--line); }
  #search-wrap.has-text #search-clear { display: block; }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit; max-width: 220px;
  }
  #filters {
    position: fixed; left: 16px; bottom: 14px; z-index: 5;
    font-size: 14px; color: var(--dim); user-select: none;
  }
  #filters .frow {
    display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 2px 0;
  }
  #filters .frow:hover { color: var(--text); }
  #filters .frow.off { opacity: 0.35; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .sw.kind-key { background: var(--dim); }
  #kind-filters { margin-top: 14px; }
  #timefilter {
    position: fixed; top: 14px; right: 16px; z-index: 5;
    display: flex; flex-direction: column; gap: 2px; align-items: flex-end;
    transition: right 0.35s ease;
  }
  #time-row { display: flex; align-items: center; gap: 8px; }
  .time-end { font-size: 11px; color: var(--dim); }
  #timefilter input[type=range] { width: 200px; accent-color: var(--accent); cursor: pointer; }
  #pane {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px;
    /* Reading text runs 25% dimmer than the app chrome (#f4f2ed / --text
       at 0.75 brightness), scoped to the pane so nothing else shifts. */
    color: #b7b6b2;
    --text: #a4aab3;
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 20px 22px;
    transform: translateX(100%); transition: transform 0.35s ease;
  }
  body.pane-open #pane { transform: translateX(0); }
  #pane-resize {
    position: fixed; top: 0; bottom: 0; width: 9px; z-index: 10;
    cursor: ew-resize; display: none; touch-action: none;
  }
  body.pane-open #pane-resize { display: block; }
  #pane-resize::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 3px; width: 2px;
  }
  #pane-resize:hover::after, #pane-resize.dragging::after { background: var(--accent); }
  #pane-close {
    position: sticky; top: 0; float: right; margin: -6px -8px 0 10px; z-index: 5;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    font: 14px "Saira", sans-serif; line-height: 1;
  }
  #pane-close:hover { color: var(--text); border-color: var(--accent); }
  #pane h2 { font-size: 17px; line-height: 1.35; margin-bottom: 8px; }
  /* Headers sit 10% brighter than the pane's dimmed body text. */
  #pane h2, .body h3, .body h4 { color: #c9c8c4; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .badge.bundle { color: #fff; border: none; }
  .badge.draft { color: #f2c94c; border-color: #f2c94c66; }
  .badge.deprecated { color: #ef5da8; border-color: #ef5da866; }
  #pane .meta { font-size: 12px; color: var(--dim); border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); padding: 10px 0; margin: 12px 0 16px; }
  #pane .meta div { margin: 2px 0; word-break: break-all; }
  #pane .meta b { color: var(--text); font-weight: 500; }
  .body h3 { font-size: 15px; margin: 18px 0 6px; }
  .body h4 { font-size: 13.5px; margin: 14px 0 5px; }
  .body p, .body ul, .body ol { margin: 8px 0; }
  .body ul, .body ol { padding-left: 20px; }
  .body li { margin: 3px 0; }
  .body a { color: var(--accent); text-decoration: none; }
  .body a:hover { text-decoration: underline; }
  .body a.node-link { border-bottom: 1px dashed var(--accent); }
  .body code { background: #0b0e14; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-size: 12px; }
  .body pre { background: #0b0e14; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 10px 0; }
  .body pre code { background: none; border: none; padding: 0; }
  .body table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; display: block;
    overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  .body .fn { font-size: 12px; color: var(--dim); margin: 3px 0; }
  .body sup { color: var(--accent); }
  #pane .neighbors { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  #pane .neighbors h5 { font-size: 12px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 6px; }
  #pane .neighbors a { display: block; color: var(--accent); font-size: 13px;
    margin: 3px 0; text-decoration: none; cursor: pointer; }
  #player { display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin: 4px 0 12px; }
  #player button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; width: 34px; height: 28px; font: inherit; font-size: 13px;
    cursor: pointer; line-height: 1;
  }
  #player button:hover { border-color: var(--accent); }
  #player button.active { border-color: var(--accent); color: var(--accent); }
  #player select { font-size: 11.5px; padding: 4px 6px; max-width: 150px; }
  #player #tts-status { font-size: 11.5px; color: var(--dim); margin-left: auto; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="hud-top">
      <h1>__WIKI_NAME__</h1>
      <span id="search-wrap">
        <input id="search" type="text" placeholder="Search…"
               autocomplete="off" spellcheck="false">
        <button id="search-clear" title="Clear search">✕</button>
      </span>
    </div>
    <div id="timefilter">
      <div id="time-row">
        <span class="time-end">Latest</span>
        <input type="range" id="time" min="0" max="1" value="1" title="Ingest-history window">
        <span class="time-end">All</span>
      </div>
    </div>
  </div>
  <div id="filters">
    <div id="bundle-filters"></div>
    <div id="kind-filters"></div>
  </div>
</div>
<aside id="pane"></aside>
<div id="pane-resize" title="Drag to resize"></div>
<script>
const DATA = __GRAPH_DATA__;
const INITIAL = __INITIAL_BUNDLE__;
const PALETTE = ["#4f8ef7", "#f7734f", "#42c98d", "#c86bfa", "#f2c94c", "#ef5da8", "#3ec6d8"];
const bundleColor = {};
DATA.bundles.forEach((b, i) => bundleColor[b] = PALETTE[i % PALETTE.length]);
const byId = new Map(DATA.nodes.map(n => [n.id, n]));

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const pane = document.getElementById("pane");
let nodes = [], edges = [], adj = new Map();
let mat = [1,0,0, 0,1,0, 0,0,1];
let zoom = 1, selected = null, hovered = null;
let dragging = false, moved = 0, lastX = 0, lastY = 0, lastInteract = 0, hasInteracted = false;

// Fling physics: releasing a drag keeps the sphere spinning with momentum,
// decaying gently to a slow perpetual ambient rotation.
const MIN_SPIN = 0.04;   // rad/s ambient floor
const MAX_SPIN = 5;      // rad/s fling cap
let momentum = null;     // {x, y: unit direction (screen axes), speed: rad/s}
let flingV = { x: 0, y: 0 }, lastMoveT = 0, lastFrameT = 0;

function rotXY(m, ax, ay) {  // apply screen-space rotations to matrix m
  const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
  const rx = [1,0,0, 0,cx,-sx, 0,sx,cx], ry = [cy,0,sy, 0,1,0, -sy,0,cy];
  return mul(rx, mul(ry, m));
}
function mul(a, b) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    o[r*3+c] = a[r*3]*b[c] + a[r*3+1]*b[3+c] + a[r*3+2]*b[6+c];
  return o;
}
function apply(m, p) {
  return [m[0]*p[0]+m[1]*p[1]+m[2]*p[2], m[3]*p[0]+m[4]*p[1]+m[5]*p[2], m[6]*p[0]+m[7]*p[1]+m[8]*p[2]];
}
function rotAxis(a, ang) {  // Rodrigues rotation matrix about unit axis a
  const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c, [x, y, z] = a;
  return [
    t*x*x + c,   t*x*y - s*z, t*x*z + s*y,
    t*x*y + s*z, t*y*y + c,   t*y*z - s*x,
    t*x*z - s*y, t*y*z + s*x, t*z*z + c,
  ];
}

// Animated spin bringing a clicked node to its resting spot on the sphere.
// That spot sits slightly up-left of dead-center: with the node off the view
// axis, its great-circle edges project as visible curves instead of straight
// spokes radiating from the middle.
const FOCUS_TARGET = (() => {
  const v = [-0.30, 0.30, 1], l = Math.hypot(...v);
  return v.map(c => c / l);
})();
function cross(a, b) {
  return [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
}
// Rotation carrying view-space direction v onto FOCUS_TARGET: {axis, angle},
// or null if v is already there. Shared by the animated and instant variants.
function focusRotation(v) {
  const t = FOCUS_TARGET;
  const angle = Math.acos(Math.min(1, Math.max(-1, v[0]*t[0] + v[1]*t[1] + v[2]*t[2])));
  if (angle < 0.01) return null;
  let axis = cross(v, t);
  const len = Math.hypot(...axis);
  axis = len < 1e-4 ? [0, 1, 0] : axis.map(c => c / len);
  return { axis, angle };
}
let spin = null;
// Aim at where a node comes to rest, not where it is mid-transition: clicking
// a neighbour while it sits out on the focus ring must spin toward the home
// position it is about to return to, or the camera chases a moving target.
function restingPos(n) { return n.to || n.p; }
function spinTo(n) {
  const rot = focusRotation(apply(mat, restingPos(n)));
  if (!rot) { spin = null; return; }
  spin = { mat0: mat.slice(), axis: rot.axis, angle: rot.angle, start: performance.now() };
}

// Focus mode: while a node is selected, only it and its direct links render.
let focus = null;
// While a node is selected the whole sphere contracts so the selected node's
// neighborhood reads as one tight cluster; it swells back on deselection.
// Only positions scale — node dots and labels keep their size.
const FOCUS_SHRINK = 0.58;
// The sphere also scales with how many nodes pass the filters: radius grows
// with the square root of the count (constant surface density), reaching
// full size at FULL_SPHERE_NODES. Small filtered sets huddle close — less
// mouse travel, easier visual linking — and the sphere grows as the history
// slider reveals more nodes.
const FULL_SPHERE_NODES = 100;
const MIN_DENSITY = 0.45;   // floor so tiny sets don't collapse to a dot
const MIN_SPHERE = 0.3;     // absolute floor once selection shrink stacks on
function densityScale() {
  return Math.min(1, Math.max(MIN_DENSITY, Math.sqrt(nodes.length / FULL_SPHERE_NODES)));
}
let sphereScale = 1;
function visibleNodes() { return focus ? nodes.filter(n => focus.has(n.id)) : nodes; }

// ---------- focus layout ----------
// Shrinking alone left the neighbourhood in whatever arrangement it happened
// to have on the full sphere: clumps only got tighter, and a neighbour that
// sat round the back stayed hidden behind it. So while a node is selected its
// neighbours fan out onto an evenly spaced ring around it and glide home again
// on deselection. Positions are model space, so a fanned-out neighbourhood is
// a real arrangement on the sphere and still turns when the user drags.
const RING_RADIUS = 0.95;   // angular radius of the ring, radians (~54 degrees)
const LAYOUT_MS = 700;         // outbound: matches the selection spin
const LAYOUT_RETURN_MS = 520;  // homeward: matches the sphere swelling back

function dot3(a, b) { return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function slerpVec(a, b, t) {
  const om = Math.acos(Math.min(1, Math.max(-1, dot3(a, b))));
  if (om < 1e-4) return b.slice();
  const s = Math.sin(om), k1 = Math.sin((1 - t) * om) / s, k2 = Math.sin(t * om) / s;
  return [a[0]*k1 + b[0]*k2, a[1]*k1 + b[1]*k2, a[2]*k1 + b[2]*k2];
}
// Two unit vectors spanning the plane perpendicular to c, so bearings around
// the selected node can be measured in a consistent frame.
function orthoBasis(c) {
  let u = cross(Math.abs(c[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0], c);
  const ul = Math.hypot(...u);
  u = ul < 1e-6 ? [1, 0, 0] : u.map(x => x / ul);
  return [u, cross(c, u)];
}

// Ring positions for a selected node's neighbourhood. Slots go to neighbours
// in the order of their existing bearing around the selected node, and the
// whole ring is then rotated to sit as close as possible to where they already
// were — so the move reads as the cluster opening out rather than reshuffling,
// and the trip back lands everyone where the eye last saw them.
function ringTargets(sel) {
  const out = new Map([[sel.id, sel.home.slice()]]);
  const nbrs = (adj.get(sel.id) || []).map(id => byId.get(id)).filter(Boolean);
  if (!nbrs.length) return out;
  const c = sel.home, [u, v] = orthoBasis(c);
  const bearing = nb => {
    const d = nb.home.map((x, i) => x - c[i] * dot3(nb.home, c));
    return Math.hypot(...d) < 1e-6 ? null : Math.atan2(dot3(d, v), dot3(d, u));
  };
  const ordered = nbrs
    .map((nb, i) => ({ nb, a: bearing(nb) ?? (i / nbrs.length) * 2 * Math.PI }))
    .sort((x, y) => x.a - y.a);
  const step = 2 * Math.PI / ordered.length;
  // Circular mean of each neighbour's offset from its slot: the ring rotation
  // that moves everyone the least.
  let sx = 0, sy = 0;
  ordered.forEach((o, k) => { const d = o.a - k * step; sx += Math.cos(d); sy += Math.sin(d); });
  const off = Math.atan2(sy, sx);
  const cosR = Math.cos(RING_RADIUS), sinR = Math.sin(RING_RADIUS);
  ordered.forEach((o, k) => {
    const a = off + k * step, cu = Math.cos(a) * sinR, cv = Math.sin(a) * sinR;
    out.set(o.nb.id, [c[0]*cosR + u[0]*cu + v[0]*cv,
                      c[1]*cosR + u[1]*cu + v[1]*cv,
                      c[2]*cosR + u[2]*cu + v[2]*cv]);
  });
  return out;
}

// Point every node at where it belongs for the current selection. Animated
// moves start from wherever the node currently sits, so switching straight
// from one selection to another glides instead of snapping home first.
let layoutAnim = null;
function setLayoutTargets(animate) {
  const targets = selected ? ringTargets(selected) : null;
  for (const n of nodes) {
    n.from = (n.p || n.home).slice();
    n.to = (targets && targets.get(n.id)) || n.home.slice();
  }
  if (animate) layoutAnim = { start: performance.now(), homeward: !selected };
  else { layoutAnim = null; for (const n of nodes) n.p = n.to.slice(); }
}

// Instantly rotate a node to front-center — no animation. Used when a
// re-layout moves the selected node: the rest of the graph snaps to new
// positions, so the anchor should simply hold still rather than glide.
function centerInstant(n) {
  const rot = focusRotation(apply(mat, n.p));
  if (!rot) return;
  spin = null;
  mat = mul(rotAxis(rot.axis, rot.angle), mat);
}

// After deselection the old node's highlight decays over ~a second instead
// of vanishing — a beacon the eye can hold while the full sphere fades in.
let ghost = null;  // { n, start }

function selectNode(n) {
  if (!n && selected) ghost = { n: selected, start: performance.now() };
  if (n) ghost = null;
  selected = n;
  if (n) momentum = null;  // reading mode: hold the sphere still
  focus = n ? new Set([n.id, ...(adj.get(n.id) || [])]) : null;
  setLayoutTargets(true);  // fan the neighbourhood out, or glide it home
  renderPane(n);
  if (n) spinTo(n);
  pushState();
}

// ---------- selection/filter history (back & forward) ----------
// Each entry snapshots the full view state: bundle filter, ingest-history
// window, and selection. Navigating restores all three, so going back also
// reverses any filter changes made along the way.
const navHist = [];
let navIdx = -1, navigating = false;

function currentState() {
  return {
    bundles: [...activeBundles].sort(),
    topic: activeKinds.topic,
    source: activeKinds.source,
    time: document.getElementById("time").value,
    q: searchQuery,
    sel: selected ? selected.id : null,
  };
}

function pushState() {
  if (navigating) return;
  const s = currentState(), prev = navHist[navIdx];
  if (prev && JSON.stringify(prev) === JSON.stringify(s)) return;
  navHist.splice(navIdx + 1);
  navHist.push(s);
  navIdx = navHist.length - 1;
  updateNavUI();
}

function navigate(dir) {
  const i = navIdx + dir;
  if (i < 0 || i >= navHist.length) return;
  navIdx = i;
  const s = navHist[i];
  navigating = true;
  activeBundles.clear();
  (s.bundles || DATA.bundles).forEach(b => activeBundles.add(b));
  activeKinds.topic = s.topic !== false;
  activeKinds.source = s.source !== false;
  document.getElementById("time").value = s.time;
  searchQuery = s.q || "";
  document.getElementById("search").value = searchQuery;
  syncSearchClear();
  applyFilter();
  renderFilters();
  selectNode(s.sel ? nodes.find(x => x.id === s.sel) || null : null);
  navigating = false;
  updateNavUI();
}

// History controls: small chevrons pinned to the left and right edges of the
// visible graph area, vertically centered. Static — they ignore zoom,
// selection, and sphere size, so the buttons are always in the same place
// (the right one only slides in step with the info pane to stay visible).
const navState = { back: false, fwd: false };
let chevHover = null;

function updateNavUI() {
  navState.back = navIdx > 0;
  navState.fwd = navIdx < navHist.length - 1;
}

function chevronSpots() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  const margin = 36;
  return {
    back: { x: margin, y: h / 2 },
    fwd: { x: w - paneShift * 2 - margin, y: h / 2 },
  };
}

function chevAt(x, y) {
  const spots = chevronSpots();
  for (const dir of ["back", "fwd"]) {
    if (!navState[dir]) continue;
    const s = spots[dir];
    if (Math.hypot(x - s.x, y - s.y) <= 16) return dir;
  }
  return null;
}

function drawNavChevrons() {
  if (!navState.back && !navState.fwd) return;
  const spots = chevronSpots();
  for (const dir of ["back", "fwd"]) {
    if (!navState[dir]) continue;
    const s = spots[dir], hov = chevHover === dir, sign = dir === "back" ? -1 : 1;
    ctx.globalAlpha = hov ? 0.95 : 0.45;
    ctx.fillStyle = "#161b25";
    ctx.beginPath(); ctx.arc(s.x, s.y, 13, 0, 7); ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = hov ? "#4f8ef7" : "#2a3140";
    ctx.stroke();
    ctx.strokeStyle = hov ? "#4f8ef7" : "#dbe2ee";
    ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(s.x - 3 * sign, s.y - 5);
    ctx.lineTo(s.x + 3 * sign, s.y);
    ctx.lineTo(s.x - 3 * sign, s.y + 5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// History window: day 0 = today (UTC). Source publication date when known,
// falling back to ingest stamps; undated concepts only appear at the
// "everything" end.
function nodeDay(n) {
  const iso = n.published_at || n.retrieved_at || n.generated_at;
  const d = iso ? new Date(iso) : null;
  if (!d || isNaN(d)) return Infinity;
  const now = new Date();
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return Math.max(0, Math.round((today - day) / 86400000));
}
DATA.nodes.forEach(n => n.day = nodeDay(n));
const maxDay = Math.max(1, ...DATA.nodes.map(n => n.day === Infinity ? 0 : n.day));

// Static classification: every ingest yields a Source and a Topic.
function isSource(n) { return ["Source", "Reference", "Transcript"].includes(n.type); }

// Bottom-left filter lists: clickable bundle rows and topic/source rows.
// Click = include/exclude. Choices persist in localStorage.
const activeBundles = new Set(INITIAL ? [INITIAL] : DATA.bundles);
const activeKinds = { topic: true, source: true };
let searchQuery = "";
const FILTERS_KEY = "llmwiki-viz-filters";

function saveFilters() {
  try {
    const t = document.getElementById("time");
    localStorage.setItem(FILTERS_KEY, JSON.stringify({
      bundles: [...activeBundles],
      topic: activeKinds.topic,
      source: activeKinds.source,
      // "all" survives the history window growing between sessions.
      time: t.value === t.max ? "all" : t.value,
    }));
  } catch (e) {}
}

function loadFilters() {
  try {
    const s = JSON.parse(localStorage.getItem(FILTERS_KEY) || "null");
    if (!s) return;
    if (!INITIAL) {  // an explicit -b flag beats remembered bundles
      const valid = (s.bundles || []).filter(b => DATA.bundles.includes(b));
      if (valid.length) { activeBundles.clear(); valid.forEach(b => activeBundles.add(b)); }
    }
    if (typeof s.topic === "boolean") activeKinds.topic = s.topic;
    if (typeof s.source === "boolean") activeKinds.source = s.source;
    const t = document.getElementById("time");
    t.value = s.time === "all" ? maxDay
      : Math.min(Number.isNaN(parseInt(s.time, 10)) ? maxDay : parseInt(s.time, 10), maxDay);
  } catch (e) {}
}

function renderFilters() {
  const bdiv = document.getElementById("bundle-filters");
  bdiv.innerHTML = DATA.bundles.map(b =>
    `<div class="frow${activeBundles.has(b) ? "" : " off"}" data-bundle="${esc(b)}">` +
    `<span class="sw" style="background:${bundleColor[b]}"></span>` +
    `<span class="fname">${esc(b)}</span></div>`
  ).join("");
  const kdiv = document.getElementById("kind-filters");
  kdiv.innerHTML =
    `<div class="frow${activeKinds.topic ? "" : " off"}" data-kind="topic">` +
    `<span class="sw kind-key"></span><span class="fname">topics</span></div>` +
    `<div class="frow${activeKinds.source ? "" : " off"}" data-kind="source">` +
    `<span class="sw kind-key"></span><span class="fname">sources</span></div>`;
  bdiv.querySelectorAll(".frow").forEach(row =>
    row.addEventListener("click", () => {
      const b = row.dataset.bundle;
      activeBundles.has(b) ? activeBundles.delete(b) : activeBundles.add(b);
      applyFilter(); renderFilters(); pushState();
    }));
  kdiv.querySelectorAll(".frow").forEach(row =>
    row.addEventListener("click", () => {
      activeKinds[row.dataset.kind] = !activeKinds[row.dataset.kind];
      applyFilter(); renderFilters(); pushState();
    }));
}

function applyFilter() {
  const prevIds = new Set(nodes.map(n => n.id));
  const timeEl2 = document.getElementById("time");
  const windowDays = parseInt(timeEl2.value, 10);
  const everything = windowDays >= maxDay;
  timeEl2.title = everything ? "everything"
    : windowDays === 0 ? "ingested today" : `last ${windowDays + 1} days`;
  nodes = DATA.nodes.filter(n =>
    activeBundles.has(n.bundle) &&
    (everything || n.day <= windowDays) &&
    (isSource(n) ? activeKinds.source : activeKinds.topic) &&
    (!searchQuery || n.title.toLowerCase().includes(searchQuery)));
  nodes.sort((a, b) => (a.bundle + a.path).localeCompare(b.bundle + b.path));
  // Nodes entering the view fade in; nodes already visible keep their fade.
  nodes.forEach(n => { n.fade = prevIds.has(n.id) ? (n.fade ?? 1) : 0; });
  const ids = new Set(nodes.map(n => n.id));
  edges = DATA.edges.filter(e => ids.has(e.s) && ids.has(e.t));
  // Deduped: a link written into both endpoints' files arrives as two edge
  // records, which would otherwise list a neighbour twice in the reading pane
  // and hand it two slots on the focus ring, leaving a gap in the circle.
  const adjSet = new Map(nodes.map(n => [n.id, new Set()]));
  for (const e of edges) { adjSet.get(e.s).add(e.t); adjSet.get(e.t).add(e.s); }
  adj = new Map([...adjSet].map(([id, s]) => [id, [...s]]));
  const n = nodes.length, golden = Math.PI * (3 - Math.sqrt(5));
  nodes.forEach((node, i) => {  // Fibonacci sphere; bundle-sorted => latitude bands
    const y = n === 1 ? 0 : 1 - 2 * (i + 0.5) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y)), phi = i * golden;
    node.home = [r * Math.cos(phi), y, r * Math.sin(phi)];
    node.p = node.home.slice();
  });
  if (selected && ids.has(selected.id)) {
    focus = new Set([selected.id, ...(adj.get(selected.id) || [])]);
    setLayoutTargets(false);  // the ring re-forms around the new layout
    centerInstant(selected);  // hold the anchor still while the layout snaps
  } else {
    focus = null;
    if (selected) { selected = null; renderPane(null); }
    setLayoutTargets(false);
  }
  saveFilters();
}

// Horizontal recenter when the pane is open: the canvas never resizes (so the
// zoom level never jumps); the sphere's center glides left by half the pane
// width. Time-based easing (matching the pane's 350ms CSS slide), so it
// behaves identically at any frame rate.
let paneShift = 0, shiftAnim = null;
function setPaneShift(target) {
  if (target !== paneShift)
    shiftAnim = { from: paneShift, to: target, start: performance.now() };
}

// Resizable pane; last width persists in localStorage.
const PANE_WIDTH_KEY = "llmwiki-viz-pane-width";
let paneWidth = 400;
try { paneWidth = parseInt(localStorage.getItem(PANE_WIDTH_KEY), 10) || 400; } catch (e) {}

function setPaneWidth(w, save) {
  paneWidth = Math.round(Math.min(Math.max(w, 300), Math.max(340, window.innerWidth - 360)));
  pane.style.width = paneWidth + "px";
  document.getElementById("pane-resize").style.right = paneWidth + "px";
  positionTimeFilter();
  if (save) { try { localStorage.setItem(PANE_WIDTH_KEY, String(paneWidth)); } catch (e) {} }
}

// The history slider lives at the top-right of the sphere area; when the
// info pane is open it slides left to sit beside it (in sync with the pane's
// own transition, instant while the pane is being resized by hand).
function positionTimeFilter() {
  const tf = document.getElementById("timefilter");
  const open = document.body.classList.contains("pane-open");
  tf.style.transition = typeof paneResizing !== "undefined" && paneResizing ? "none" : "";
  tf.style.right = (open ? paneWidth + 16 : 16) + "px";
}

function project(p) {
  const v = apply(mat, p);
  const S = Math.min(canvas.width, canvas.height) / (window.devicePixelRatio || 1);
  const scale = S * 0.408 * zoom * sphereScale, per = 1 / (1 - v[2] * 0.32);
  const w = canvas.width / (window.devicePixelRatio || 1), h = canvas.height / (window.devicePixelRatio || 1);
  return { x: w / 2 - paneShift + v[0] * scale * per, y: h / 2 - v[1] * scale * per, z: v[2], per };
}

function drawBackground(w, h, now) {
  let g = ctx.createRadialGradient(w / 2, h * 0.42, 0, w / 2, h * 0.42, Math.hypot(w, h) * 0.65);
  g.addColorStop(0, "#141b2e"); g.addColorStop(0.5, "#0c1120"); g.addColorStop(1, "#04060c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  g = ctx.createRadialGradient(w * 0.78, h * 0.88, 0, w * 0.78, h * 0.88, Math.max(w, h) * 0.55);
  g.addColorStop(0, "rgba(118, 82, 220, 0.10)"); g.addColorStop(1, "rgba(118, 82, 220, 0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  g = ctx.createRadialGradient(w * 0.16, h * 0.12, 0, w * 0.16, h * 0.12, Math.max(w, h) * 0.5);
  g.addColorStop(0, "rgba(64, 130, 240, 0.07)"); g.addColorStop(1, "rgba(64, 130, 240, 0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground(w, h, performance.now());
  if (shiftAnim) {
    const t = Math.min(1, (performance.now() - shiftAnim.start) / 350);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    paneShift = shiftAnim.from + (shiftAnim.to - shiftAnim.from) * e;
    if (t >= 1) shiftAnim = null;
  }
  const nowT = performance.now();
  const dt = Math.min(0.05, lastFrameT ? (nowT - lastFrameT) / 1000 : 0.016);
  lastFrameT = nowT;
  if (spin) {
    const t = Math.min(1, (nowT - spin.start) / 700);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;  // easeInOut
    mat = mul(rotAxis(spin.axis, spin.angle * e), spin.mat0);
    if (t >= 1) spin = null;
  }
  if (momentum && !dragging && !spin) {
    // Exponential decay down to the ambient floor, then coast forever.
    momentum.speed = Math.max(MIN_SPIN, momentum.speed * Math.exp(-dt * 1.4));
    mat = rotXY(mat, momentum.x * momentum.speed * dt, momentum.y * momentum.speed * dt);
  }
  // Auto-rotate only until the user first interacts; a scene that keeps
  // moving makes nodes impossible to click deliberately.
  if (!hasInteracted && !dragging && !spin && nowT - lastInteract > 1500)
    mat = rotXY(mat, 0, 0.0018);

  // Nodes glide between their home layout and the focus ring. Writing the
  // result back into n.p means projection, edge arcs, depth sorting and
  // hit-testing all follow the animation for free — a fanned-out node is
  // clickable exactly where it looks.
  if (layoutAnim) {
    const dur = layoutAnim.homeward ? LAYOUT_RETURN_MS : LAYOUT_MS;
    const t = Math.min(1, (nowT - layoutAnim.start) / dur);
    // Outbound eases in and out so it travels with the camera spin. The trip
    // home has no spin to match — only the sphere swelling back and the hidden
    // nodes fading in, both of which start fast — so it eases out instead and
    // sets off immediately rather than hanging for a beat first.
    const e = layoutAnim.homeward
      ? 1 - Math.pow(1 - t, 3)                                    // easeOut
      : (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);  // easeInOut
    for (const n of nodes) n.p = slerpVec(n.from, n.to, e);
    if (t >= 1) { for (const n of nodes) n.p = n.to.slice(); layoutAnim = null; }
  }
  // The sphere eases toward its target size on the same clock as the focus
  // cross-fade below: node-count density sets the base size, and selection
  // shrinks further to tighten the neighborhood.
  const sTgt = Math.max(MIN_SPHERE, densityScale() * (selected ? FOCUS_SHRINK : 1));
  sphereScale = sTgt + (sphereScale - sTgt) * Math.exp(-dt * 6);
  if (Math.abs(sphereScale - sTgt) < 0.001) sphereScale = sTgt;
  // Focus mode is a smooth cross-fade: every filter-passing node eases its
  // opacity toward 1 (in the focus neighborhood, or no focus) or 0 (hidden
  // by focus), so entering/leaving selection never pops.
  for (const n of nodes) {
    const tgt = !focus || focus.has(n.id) ? 1 : 0;
    n.fade = tgt + ((n.fade === undefined ? 1 : n.fade) - tgt) * Math.exp(-dt * 9);
    if (Math.abs(n.fade - tgt) < 0.01) n.fade = tgt;
  }
  if (ghost && (selected || nowT - ghost.start > 900)) ghost = null;
  const gFade = ghost ? Math.max(0, 1 - (nowT - ghost.start) / 900) : 0;
  const proj = new Map(nodes.map(n => [n.id, project(n.p)]));
  for (const e of edges) {
    const eFade = Math.min(byId.get(e.s).fade ?? 1, byId.get(e.t).fade ?? 1);
    if (eFade < 0.02) continue;
    // Edges follow the sphere: sample the great-circle arc between the two
    // nodes (slerp) and draw it as segments, each faded by its own depth so
    // the line dims as it wraps toward the far side.
    const pa = byId.get(e.s).p, pb = byId.get(e.t).p;
    // Edges light up blue for the selected node AND the hovered node; the
    // gradient radiates from whichever highlighted node the edge touches.
    let origin = null, originFade = 1;
    if (selected && (e.s === selected.id || e.t === selected.id)) origin = selected.id;
    else if (hovered && (e.s === hovered.id || e.t === hovered.id)) origin = hovered.id;
    else if (ghost && (e.s === ghost.n.id || e.t === ghost.n.id)) {
      origin = ghost.n.id; originFade = gFade;  // blue drains away gradually
    }
    const active = origin !== null;
    const selAtStart = active && e.s === origin;
    const dot = Math.min(1, Math.max(-1, pa[0]*pb[0] + pa[1]*pb[1] + pa[2]*pb[2]));
    const omega = Math.acos(dot), sinO = Math.sin(omega);
    const steps = Math.max(2, Math.ceil(omega * 14));
    ctx.lineCap = "butt";  // translucent round caps double-blend into dots
    const slerp = t => {
      if (sinO < 1e-4) return pb;
      const k1 = Math.sin((1 - t) * omega) / sinO, k2 = Math.sin(t * omega) / sinO;
      return [pa[0]*k1 + pb[0]*k2, pa[1]*k1 + pb[1]*k2, pa[2]*k1 + pb[2]*k2];
    };
    const arcA = proj.get(e.s), arcB = proj.get(e.t);
    const tracePath = () => {
      ctx.beginPath();
      ctx.moveTo(arcA.x, arcA.y);
      for (let i = 1; i <= steps; i++) {
        const cur = i === steps ? arcB : project(slerp(i / steps));
        ctx.lineTo(cur.x, cur.y);
      }
    };
    if (active && originFade === 1) {
      // One continuous path stroked with a real linear gradient — full blue
      // at the highlighted node, fading toward the neighbor.
      const selP = selAtStart ? arcA : arcB, othP = selAtStart ? arcB : arcA;
      const g = ctx.createLinearGradient(selP.x, selP.y, othP.x, othP.y);
      g.addColorStop(0, "rgba(79, 142, 247, 0.9)");
      g.addColorStop(1, "rgba(79, 142, 247, 0.14)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = eFade;
      tracePath();
      ctx.stroke();
      continue;
    }
    // Grey edges: one continuous path with a depth-driven gradient — brighter
    // where the arc is nearer the viewer, sampled at both ends and the
    // midpoint (arcs can bow toward the camera between two far endpoints).
    const mid = project(slerp(0.5));
    // Quadratic depth fade: near ends stay visible, far ends all but vanish.
    const alphaAt = z => (0.008 + 0.15 * Math.pow((z + 1) / 2, 2)).toFixed(3);
    const g = ctx.createLinearGradient(arcA.x, arcA.y, arcB.x, arcB.y);
    g.addColorStop(0, `rgba(139, 149, 167, ${alphaAt(arcA.z)})`);
    g.addColorStop(0.5, `rgba(139, 149, 167, ${alphaAt(mid.z)})`);
    g.addColorStop(1, `rgba(139, 149, 167, ${alphaAt(arcB.z)})`);
    ctx.strokeStyle = g;
    ctx.lineWidth = 1;
    ctx.globalAlpha = eFade;
    tracePath();
    ctx.stroke();
    if (active && originFade > 0) {
      // Lingering highlight: the blue drains off the grey base as the ghost
      // fades, crossfading blue -> grey instead of popping.
      const selP = selAtStart ? arcA : arcB, othP = selAtStart ? arcB : arcA;
      const bg = ctx.createLinearGradient(selP.x, selP.y, othP.x, othP.y);
      bg.addColorStop(0, "rgba(79, 142, 247, 0.9)");
      bg.addColorStop(1, "rgba(79, 142, 247, 0.14)");
      ctx.strokeStyle = bg;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = eFade * originFade;
      tracePath();
      ctx.stroke();
    }
  }
  const order = [...nodes].sort((a, b) => proj.get(a.id).z - proj.get(b.id).z);
  for (const n of order) {
    if (n.fade < 0.02) continue;
    const p = proj.get(n.id);
    const isSel = selected && n.id === selected.id, isHov = hovered && n.id === hovered.id;
    const neighbor = selected && adj.get(selected.id).includes(n.id);
    const isGhost = ghost && n.id === ghost.n.id;
    const r = (isSel ? 10 : 6.5 + (isGhost ? 3.5 * gFade : 0)) * p.per * (isHov ? 1.25 : 1);
    // Selected/hovered circles are fully opaque so edges never show through.
    ctx.globalAlpha = (isSel || isHov ? 1 : 0.45 + 0.55 * (p.z + 1) / 2) * n.fade;
    ctx.fillStyle = bundleColor[n.bundle] || "#999";
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
    if (isSource(n)) {  // sources hollow, topics solid
      ctx.lineWidth = 2.4; ctx.strokeStyle = ctx.fillStyle; ctx.stroke();
    } else ctx.fill();
    if (isSel || neighbor) {
      ctx.lineWidth = 1.5; ctx.strokeStyle = isSel ? "#fff" : "#ffffff88";
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3.5, 0, 7); ctx.stroke();
    } else if (isGhost && gFade > 0) {
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = gFade;
      ctx.strokeStyle = "#fff";
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3.5, 0, 7); ctx.stroke();
    }
    {
      ctx.globalAlpha = (isSel || isHov ? 1 : 0.4 + 0.45 * Math.max(0, p.z)) * n.fade;
      ctx.fillStyle = "#dbe2ee";
      // Labels always render. Size falls off quickly as a node recedes from
      // the viewer (quadratic in z), then stabilizes at a floor from the
      // sphere's midpoint all the way to the far side.
      const depth = 0.62 + 0.68 * Math.pow(Math.max(0, p.z), 2);
      const fs = Math.max(6, Math.min(26, 11 * zoom * (isSel || isHov ? Math.max(depth, 1) : depth)));
      ctx.font = `${isSel ? "600 " : ""}${fs.toFixed(1)}px Saira, -apple-system, sans-serif`;
      ctx.textAlign = "center";
      const maxChars = Math.round(34 * Math.max(1, zoom));  // more room when zoomed in
      let label = n.title;
      // Hovered (and selected) nodes show their full, untruncated title.
      if (!isHov && !isSel && label.length > maxChars) label = label.slice(0, maxChars - 2) + "…";
      ctx.fillText(label, p.x, p.y + r + fs + 3);
    }
  }
  ctx.globalAlpha = 1;
  drawNavChevrons();
  requestAnimationFrame(draw);
}

function pick(x, y) {
  let best = null, bestZ = -2;
  for (const n of visibleNodes()) {
    const p = project(n.p);
    if (Math.hypot(p.x - x, p.y - y) < 11 * p.per + 3 && p.z > bestZ) { best = n; bestZ = p.z; }
  }
  return best;
}

canvas.addEventListener("pointerdown", e => {
  hasInteracted = true; spin = null; momentum = null;  // grabbing stops motion
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  flingV = { x: 0, y: 0 }; lastMoveT = performance.now();
  canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  lastInteract = performance.now();
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    mat = rotXY(mat, dy * 0.006, dx * 0.006);
    const dtm = Math.max(1, lastInteract - lastMoveT);
    flingV = { x: 0.7 * flingV.x + 0.3 * (dx / dtm), y: 0.7 * flingV.y + 0.3 * (dy / dtm) };
    lastMoveT = lastInteract;
    lastX = e.clientX; lastY = e.clientY;
  } else {
    chevHover = chevAt(e.clientX, e.clientY);
    hovered = chevHover ? null : pick(e.clientX, e.clientY);
    canvas.style.cursor = chevHover ? "pointer" : "";
  }
});
canvas.addEventListener("pointerup", e => {
  dragging = false; canvas.classList.remove("dragging");
  if (moved < 5) {
    const chev = chevAt(e.clientX, e.clientY);
    if (chev) { navigate(chev === "back" ? -1 : 1); return; }
    selectNode(pick(e.clientX, e.clientY));
    return;
  }
  // A real drag with no selection: fling. px/ms * 1000 * 0.006 rad/px = *6 rad/s.
  if (!selected && performance.now() - lastMoveT < 120) {
    const wx = flingV.y * 6, wy = flingV.x * 6;
    const speed = Math.hypot(wx, wy);
    if (speed > 0.08)
      momentum = { x: wx / speed, y: wy / speed, speed: Math.min(speed, MAX_SPIN) };
  }
});
canvas.addEventListener("wheel", e => {
  e.preventDefault(); hasInteracted = true; lastInteract = performance.now();
  zoom = Math.min(3, Math.max(0.4, zoom * (e.deltaY < 0 ? 1.08 : 0.93)));
}, { passive: false });

function resize() {
  const dpr = window.devicePixelRatio || 1, r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  canvas.style.width = r.width + "px"; canvas.style.height = r.height + "px";
}
window.addEventListener("resize", resize);

// ---------- info pane ----------
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function resolveNodeLink(fromNode, href) {
  const bare = href.split("#")[0];
  if (!bare.endsWith(".md")) return null;
  let parts;
  if (bare.startsWith("/")) parts = (fromNode.bundle + bare).split("/");
  else parts = [fromNode.bundle, ...fromNode.path.split("/").slice(0, -1), ...bare.split("/")];
  const out = [];
  for (const p of parts) {
    if (p === "" || p === ".") continue;
    if (p === "..") out.pop(); else out.push(p);
  }
  const id = out.join("/");
  return byId.has(id) ? id : null;
}

function inline(s, node) {
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\[\^([^\]]+)\]/g, '<sup>[$1]</sup>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    const nid = resolveNodeLink(node, href);
    if (nid) return `<a class="node-link" data-node="${esc(nid)}">${text}</a>`;
    if (/^https?:/.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
    return `<span>${text}</span>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  return s;
}

function joinWrapped(lines) {  // merge hard-wrapped continuation lines
  const out = [];
  let inCode = false;
  for (const raw of lines) {
    const t = raw.trim();
    if (t.startsWith("```")) { inCode = !inCode; out.push(raw); continue; }
    if (inCode) { out.push(raw); continue; }
    const startsBlock = !t || /^#{1,6}\s/.test(t) || /^([-*]|\d+\.)\s/.test(t) ||
      t.startsWith("|") || /^\[\^[^\]]+\]:/.test(t);
    if (!startsBlock && out.length) {
      const prev = out[out.length - 1].trim();
      if (prev && !prev.startsWith("```") && !prev.startsWith("|") && !/^#{1,6}\s/.test(prev)) {
        out[out.length - 1] += " " + t; continue;
      }
    }
    out.push(raw);
  }
  return out;
}

function md2html(md, node) {
  const lines = joinWrapped(md.split("\n")), out = [];
  let inCode = false, inList = false, table = [];
  const flushTable = () => {
    if (!table.length) return;
    let html = "<table>";
    table.forEach((cells, i) => {
      if (i === 1 && cells.every(c => /^:?-+:?$/.test(c.trim()))) return;
      const tag = i === 0 ? "th" : "td";
      html += "<tr>" + cells.map(c => `<${tag}>${inline(esc(c.trim()), node)}</${tag}>`).join("") + "</tr>";
    });
    out.push(html + "</table>"); table = [];
  };
  const closeList = () => { if (inList) { out.push("</ul>"); inList = false; } };
  for (const raw of lines) {
    if (raw.trim().startsWith("```")) {
      flushTable(); closeList();
      out.push(inCode ? "</code></pre>" : "<pre><code>"); inCode = !inCode; continue;
    }
    if (inCode) { out.push(esc(raw) + "\n"); continue; }
    const line = raw.trimEnd();
    if (/^\|.*\|$/.test(line.trim())) {
      closeList(); table.push(line.trim().slice(1, -1).split("|")); continue;
    }
    flushTable();
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeList(); out.push(`<h${Math.min(h[1].length + 2, 5)}>${inline(esc(h[2]), node)}</h${Math.min(h[1].length + 2, 5)}>`); continue; }
    const fn = line.match(/^\[\^([^\]]+)\]:\s*(.*)/);
    if (fn) { closeList(); out.push(`<div class="fn"><sup>[${esc(fn[1])}]</sup> ${inline(esc(fn[2]), node)}</div>`); continue; }
    const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push(`<li>${inline(esc(li[1]), node)}</li>`); continue;
    }
    closeList();
    if (line.trim()) out.push(`<p>${inline(esc(line), node)}</p>`);
  }
  flushTable(); closeList();
  if (inCode) out.push("</code></pre>");
  return out.join("");
}

// ---------- text-to-speech (Web Speech API; no external services) ----------
const tts = { chunks: [], idx: 0, playing: false, paused: false, voice: null, rate: 1.25, voices: [] };

function loadVoices() {
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  // en-GB first, premium/enhanced before compact, for the dropdown.
  const quality = v => (/premium/i.test(v.name) ? 0 : /enhanced|natural/i.test(v.name) ? 1 : 2);
  tts.voices = all
    .filter(v => v.lang.toLowerCase().startsWith("en"))
    .sort((a, b) => (a.lang === "en-GB" ? 0 : 1) - (b.lang === "en-GB" ? 0 : 1)
      || quality(a) - quality(b) || a.name.localeCompare(b.name));
  // Soft Received-Pronunciation female voices first. Serena (Premium) is the
  // best of these; it appears once downloaded via macOS System Settings.
  const prefs = ["Serena (Premium)", "Serena", "Kate (Premium)", "Kate (Enhanced)", "Kate",
                 "Stephanie", "Sonia", "Libby", "Martha",
                 "Google UK English Female", "Flo (English (UK))", "Shelley (English (UK))",
                 "Moira", "Tessa"];
  tts.voice = null;
  for (const p of prefs) {
    const v = all.find(v => v.name.startsWith(p) && v.lang.toLowerCase().startsWith("en"));
    if (v) { tts.voice = v; break; }
  }
  if (!tts.voice)
    tts.voice = all.find(v => v.lang === "en-GB") || tts.voices[0] || all[0];
  const sel = document.getElementById("tts-voice");
  if (sel) populateVoiceSelect(sel);
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function populateVoiceSelect(sel) {
  sel.innerHTML = tts.voices.map(v =>
    `<option${tts.voice && v.name === tts.voice.name ? " selected" : ""}>${esc(v.name)}</option>`).join("");
}

function speechText(n) {
  let body = n.body
    .replace(/```[\s\S]*?```/g, " Code block omitted. ")
    .replace(/\*\*\[\d{2}:\d{2}:\d{2}\]\*\*/g, "")     // transcript timestamps
    .replace(/^\[\^[^\]]+\]:.*$/gm, "")                // footnote definitions
    .replace(/\[\^[^\]]+\]/g, "")                      // footnote references
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")           // links -> text
    .replace(/^#{1,6}\s+(.*)$/gm, "$1.")               // headings end as sentences
    .replace(/^[\s|:-]+$/gm, "")                       // table separator rows
    .replace(/\|/g, ", ")
    .replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*\n]+)\*/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/^\s*(?:[-*]|\d+\.)\s+/gm, "")
    .replace(/\s+/g, " ").trim();
  return `${n.title}. ${n.description || ""} ${body}`;
}

function chunkText(text) {
  const sentences = text.split(/(?<=[.!?])\s+/), chunks = [];
  let cur = "";
  for (const s of sentences) {
    if (cur && cur.length + s.length > 240) { chunks.push(cur); cur = s; }
    else cur = cur ? cur + " " + s : s;
  }
  if (cur.trim()) chunks.push(cur);
  return chunks;
}

function ttsPlay(n) {
  ttsStop();
  tts.chunks = chunkText(speechText(n));
  tts.idx = 0; tts.playing = true; tts.paused = false;
  speakNext(); updatePlayerUI();
}

function speakNext() {
  if (!tts.playing || tts.idx >= tts.chunks.length) {
    tts.playing = false; tts.paused = false; updatePlayerUI(); return;
  }
  const u = new SpeechSynthesisUtterance(tts.chunks[tts.idx]);
  if (tts.voice) u.voice = tts.voice;
  u.rate = tts.rate; u.pitch = 0.97;  // fractionally lower pitch reads calmer
  u.onend = () => { if (tts.playing) { tts.idx++; updatePlayerUI(); speakNext(); } };
  u.onerror = () => { if (tts.playing) { tts.playing = false; updatePlayerUI(); } };
  speechSynthesis.speak(u);
}

function ttsPauseResume() {
  if (!tts.playing) return;
  if (tts.paused) { speechSynthesis.resume(); tts.paused = false; }
  else { speechSynthesis.pause(); tts.paused = true; }
  updatePlayerUI();
}

function ttsStop() {
  tts.playing = false; tts.paused = false;
  speechSynthesis.cancel();
  updatePlayerUI();
}

function updatePlayerUI() {
  const status = document.getElementById("tts-status");
  const toggle = document.getElementById("tts-toggle");
  if (!status) return;
  toggle.classList.toggle("active", tts.playing);
  toggle.textContent = !tts.playing ? "▶" : (tts.paused ? "▶" : "⏸");
  toggle.title = !tts.playing ? "Read this concept aloud" : (tts.paused ? "Resume" : "Pause");
  status.textContent = tts.playing
    ? (tts.paused ? "paused · " : "") + `${Math.min(tts.idx + 1, tts.chunks.length)}/${tts.chunks.length}`
    : "";
}

function renderPane(n) {
  ttsStop();
  document.body.classList.toggle("pane-open", !!n);
  setPaneShift(n ? paneWidth / 2 : 0);
  positionTimeFilter();
  if (!n) { pane.innerHTML = ""; return; }
  const color = bundleColor[n.bundle];
  let html = `<button id="pane-close" title="Close and deselect">✕</button>`;
  html += `<h2>${esc(n.title)}</h2><div class="badges">`;
  html += `<span class="badge bundle" style="background:${color}">${esc(n.bundle)}</span>`;
  html += `<span class="badge">${esc(n.type)}</span>`;
  if (n.status !== "stable") html += `<span class="badge ${esc(n.status)}">${esc(n.status)}</span>`;
  for (const t of n.tags) html += `<span class="badge">#${esc(t)}</span>`;
  html += `</div>`;
  if (n.description) html += `<p>${esc(n.description)}</p>`;
  html += `<div id="player">
    <button id="tts-toggle" title="Read this concept aloud">▶</button>
    <button id="tts-stop" title="Stop">■</button>
    <select id="tts-voice" title="Voice"></select>
    <select id="tts-rate" title="Speed">
      <option value="0.85">0.85×</option><option value="0.95">0.95×</option>
      <option value="1">1×</option><option value="1.1">1.1×</option>
      <option value="1.25" selected>1.25×</option><option value="1.5">1.5×</option>
    </select>
    <span id="tts-status"></span>
  </div>`;
  html += `<div class="meta">`;
  html += `<div><b>path</b> ${esc(n.bundle)}/${esc(n.path)}</div>`;
  if (n.resource) html += `<div><b>resource</b> <a href="${esc(n.resource)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(n.resource)}</a></div>`;
  if (n.published_at) html += `<div><b>published</b> ${esc(n.published_at.slice(0, 10))}</div>`;
  if (n.generated_by) html += `<div><b>generated</b> ${esc(n.generated_by)} @ ${esc(n.generated_at)}</div>`;
  for (const v of n.verified) html += `<div><b>verified</b> ${esc(v)}</div>`;
  if (n.stale_after) html += `<div><b>stale after</b> ${esc(n.stale_after)}</div>`;
  if (n.raw) html += `<div><b>raw</b> ${esc(n.raw)}</div>`;
  html += `</div><div class="body">${md2html(n.body, n)}</div>`;
  const neighbors = adj.get(n.id) || [];
  if (neighbors.length) {
    html += `<div class="neighbors"><h5>Linked concepts</h5>`;
    for (const id of neighbors) html += `<a data-node="${esc(id)}">${esc(byId.get(id).title)}</a>`;
    html += `</div>`;
  }
  pane.innerHTML = html;
  pane.scrollTop = 0;
  pane.querySelectorAll("[data-node]").forEach(a =>
    a.addEventListener("click", () => selectNode(byId.get(a.dataset.node))));
  document.getElementById("pane-close").addEventListener("click", () => selectNode(null));
  populateVoiceSelect(document.getElementById("tts-voice"));
  document.getElementById("tts-toggle").addEventListener("click", () => {
    if (!tts.playing) ttsPlay(n);
    else ttsPauseResume();
  });
  document.getElementById("tts-stop").addEventListener("click", ttsStop);
  document.getElementById("tts-voice").addEventListener("change", e => {
    tts.voice = tts.voices.find(v => v.name === e.target.value) || tts.voice;
  });
  document.getElementById("tts-rate").addEventListener("change", e => {
    tts.rate = parseFloat(e.target.value);
  });
}

// ---------- boot ----------
const timeEl = document.getElementById("time");
timeEl.max = maxDay; timeEl.value = maxDay;
timeEl.addEventListener("input", () => applyFilter());  // live preview
timeEl.addEventListener("change", pushState);  // one history entry per released drag
const searchEl = document.getElementById("search");

// The best textual match: earliest occurrence of the query in the title,
// then shortest title; topics edge out sources on exact ties.
function bestMatch(q) {
  let best = null, bestScore = Infinity;
  for (const n of nodes) {
    const idx = n.title.toLowerCase().indexOf(q);
    if (idx < 0) continue;
    const score = idx * 1000 + n.title.length + (isSource(n) ? 0.5 : 0);
    if (score < bestScore) { bestScore = score; best = n; }
  }
  return best;
}

function syncSearchClear() {
  document.getElementById("search-wrap").classList.toggle("has-text", !!searchEl.value);
}
function clearSearch() {
  searchEl.value = ""; searchQuery = "";
  syncSearchClear();
  applyFilter();
  pushState();
  searchEl.focus();
}
searchEl.addEventListener("input", () => {
  searchQuery = searchEl.value.trim().toLowerCase();
  syncSearchClear();
  applyFilter();  // live narrowing per keystroke
  // A selected node owns the center; only spin to the best match when
  // nothing is selected.
  if (!selected && searchQuery && nodes.length) {
    const m = bestMatch(searchQuery);
    if (m) { momentum = null; spinTo(m); }  // glide the best hit to center
  }
});
searchEl.addEventListener("change", pushState);  // one history entry per edit
searchEl.addEventListener("keydown", e => {
  if (e.key === "Escape") clearSearch();
});
document.getElementById("search-clear").addEventListener("click", clearSearch);
window.addEventListener("keydown", e => {
  if (e.target !== document.body) return;  // don't hijack selects/sliders
  if (e.key === "ArrowLeft") navigate(-1);
  else if (e.key === "ArrowRight") navigate(1);
});
const resizeHandle = document.getElementById("pane-resize");
let paneResizing = false;
resizeHandle.addEventListener("pointerdown", e => {
  e.preventDefault();
  paneResizing = true;
  resizeHandle.classList.add("dragging");
  resizeHandle.setPointerCapture(e.pointerId);
});
resizeHandle.addEventListener("pointermove", e => {
  if (!paneResizing) return;
  setPaneWidth(window.innerWidth - e.clientX, false);
  shiftAnim = null;
  paneShift = paneWidth / 2;  // recenter live while dragging
});
resizeHandle.addEventListener("pointerup", () => {
  paneResizing = false;
  resizeHandle.classList.remove("dragging");
  setPaneWidth(paneWidth, true);  // persist
});
setPaneWidth(paneWidth, false);
window.addEventListener("resize", () => setPaneWidth(paneWidth, false));

resize();
loadFilters();
renderFilters();
applyFilter();
pushState();  // baseline history entry
mat = rotXY(mat, -0.4, 0.6);
draw();
</script>
</body>
