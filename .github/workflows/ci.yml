name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
      - name: Validate example bundles (if any)
        run: |
          if [ -f config.yaml ]; then uv run llmwiki validate; fi
