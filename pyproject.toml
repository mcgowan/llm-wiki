[project]
name = "llm-wiki"
version = "0.1.0"
description = "An OKF v0.2 LLM wiki with web-research and YouTube-transcript ingestion tooling"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2026.1.1",
    "pyyaml>=6.0",
]

[project.scripts]
llmwiki = "llmwiki.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki"]
